<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 220" role="img" aria-labelledby="logo2v-title logo2v-desc">
  <title id="logo2v-title">Cresx Manna Logo - Concept 2 Vertical</title>
  <desc id="logo2v-desc">Interlocking CM monogram in hexagonal African shield motif, vertical layout</desc>

  <defs>
    <linearGradient id="shield-grad-v" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#E8932A"/>
      <stop offset="50%" style="stop-color:#C65D3A"/>
      <stop offset="100%" style="stop-color:#8B3A1D"/>
    </linearGradient>
  </defs>

  <g id="icon" transform="translate(50, 10)">
    <polygon points="50,0 95,25 95,75 50,100 5,75 5,25"
             fill="url(#shield-grad-v)" stroke="#1A1A1A" stroke-width="2"/>

    <polygon points="50,12 83,30 83,70 50,88 17,70 17,30"
             fill="none" stroke="#F4A73A" stroke-width="1.5" opacity="0.7"/>

    <text x="32" y="62" font-family="'Playfair Display', Georgia, serif" font-size="48" font-weight="900" fill="#F4A73A">C</text>
    <text x="50" y="62" font-family="'Playfair Display', Georgia, serif" font-size="48" font-weight="900" fill="#1A1A1A">M</text>

    <path d="M35 8 L50 -5 L65 8 L60 15 L50 10 L40 15 Z" fill="#2F5D3A"/>
  </g>

  <g id="wordmark" transform="translate(100, 150)">
    <text x="0" y="0" font-family="'Playfair Display', Georgia, serif" font-size="36" font-weight="900" fill="#1A1A1A" letter-spacing="-1" text-anchor="middle">Cresx</text>
    <text x="0" y="30" font-family="'DM Sans', Arial, sans-serif" font-size="20" font-weight="600" fill="#C65D3A" letter-spacing="3" text-anchor="middle">MANNA</text>
    <rect x="-40" y="38" width="80" height="2" fill="url(#shield-grad-v)"/>
  </g>
</svg>