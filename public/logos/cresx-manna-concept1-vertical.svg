<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 220" role="img" aria-labelledby="logo1v-title logo1v-desc">
  <title id="logo1v-title">Cresx Manna Logo - Concept 1 Vertical</title>
  <desc id="logo1v-desc">Stylized mango crown with kente-inspired geometric pattern, vertical layout</desc>

  <defs>
    <pattern id="kente-stripes-v" patternUnits="userSpaceOnUse" width="12" height="12" patternTransform="rotate(45)">
      <rect width="4" height="12" fill="#E8932A"/>
      <rect x="4" width="4" height="12" fill="#C65D3A"/>
      <rect x="8" width="4" height="12" fill="#2F5D3A"/>
    </pattern>

    <linearGradient id="mango-grad-v" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#F4A73A"/>
      <stop offset="100%" style="stop-color:#E8932A"/>
    </linearGradient>
  </defs>

  <!-- Icon centered -->
  <g id="icon" transform="translate(50, 10)">
    <path d="M45 85 Q15 65 20 35 Q25 5 50 10 Q75 5 80 35 Q85 65 55 85 Q50 88 45 85 Z"
          fill="url(#mango-grad-v)" stroke="#C65D3A" stroke-width="2"/>

    <path d="M35 15 L50 2 L65 15 L60 25 L50 18 L40 25 Z"
          fill="url(#kente-stripes-v)" stroke="#1A1A1A" stroke-width="1.5"/>

    <path d="M75 25 Q90 15 85 35 Q80 45 75 40 Q73 32 75 25 Z"
          fill="#2F5D3A" stroke="#1A5A30" stroke-width="1"/>

    <ellipse cx="35" cy="35" rx="8" ry="12" fill="white" opacity="0.3"/>
  </g>

  <!-- Wordmark stacked -->
  <g id="wordmark" transform="translate(100, 150)">
    <text x="0" y="0" font-family="'Playfair Display', Georgia, serif" font-size="36" font-weight="900" fill="#1A1A1A" letter-spacing="-1" text-anchor="middle">Cresx</text>
    <text x="0" y="30" font-family="'DM Sans', Arial, sans-serif" font-size="20" font-weight="600" fill="#C65D3A" letter-spacing="3" text-anchor="middle">MANNA</text>
    <rect x="-30" y="38" width="60" height="2" fill="#E8932A"/>
    <rect x="35" y="38" width="30" height="2" fill="#2F5D3A"/>
  </g>
</svg>